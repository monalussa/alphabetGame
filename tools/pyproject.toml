[project]
name = "alphabet-tools"
version = "0.1.0"
description = "Build-time content tools for alphabetGame: validation, pack build, audio generation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.26.0",
]

[project.scripts]
alphabet-content = "alphabet_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphabet_tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "PTH"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.12"

[dependency-groups]
audio = [
    "lameenc>=1.9.0",
    "numpy>=2.5.5",
    "piper-tts>=1.8.0",
]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-jsonschema>=4.26.0.20261006",
]

[[tool.mypy.overrides]]
module = ["lameenc", "piper", "piper.*"]
ignore_missing_imports = true
follow_untyped_imports = false
disallow_untyped_calls = false
